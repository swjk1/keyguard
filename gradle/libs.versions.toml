[versions]
agp = "8.13.0"
kotlin = "2.1.0"
kotlinxSerialization = "1.7.3"
junit = "5.11.3"
androidxCore = "1.15.0"
androidxAppcompat = "1.7.0"
androidxPreference = "1.2.1"
material = "1.12.0"
json = "20240303"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.11.3" }
# Unit tests only. The Android SDK stub throws from every org.json method, so the wire format
# of a supervision event would otherwise be the one part of it nothing could test.
json = { module = "org.json:json", version.ref = "json" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-preference = { module = "androidx.preference:preference-ktx", version.ref = "androidxPreference" }
material = { module = "com.google.android.material:material", version.ref = "material" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
